<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKP Ruta 40 — Órdenes de trabajo</title>
<meta name="description" content="Sistema interno de órdenes de trabajo, historial de vehículos y avisos por WhatsApp de CKP Ruta 40, Junín de los Andes.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Paleta y tipografías del taller (clásico azul) ===== */
:root{
  /* Colores del logo CKP Ruta 40: rojo, amarillo, gris y negro.
     (las variables --azul* se mantienen de nombre: ahora son el color principal rojo) */
  --negro:#0b0b0b; --negro-2:#1c1c1c; --rojo:#c62828; --amarillo:#f2cf3a; --gris:#8f8f8f;
  --azul:#c62828; --azul-2:#a11f1b; --azul-claro:#fff6d9; --azul-borde:#ecd27c;
  --fondo:#f3f3f2; --card:#ffffff; --texto:#161616; --muted:#5e5e5e; --borde:#dddcda;
  --ok:#1b7041; --ok-bg:#e3f5ea; --warn:#8a5300; --warn-bg:#fff2d6; --danger:#b42318; --danger-bg:#fdecea;
  --wa:#1a9e50; --wa-2:#14813f;
  --f-texto:'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-titulo:'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  --radio:10px; --nav-h:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--f-texto);font-size:16px;line-height:1.5;color:var(--texto);background:var(--fondo);-webkit-font-smoothing:antialiased}
a{color:#a11f1b}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-titulo);font-weight:600;margin:0;line-height:1.15;letter-spacing:.2px}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid #f0a020;outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Estructura ===== */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--negro);color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--amarillo)}
.logo-img{height:44px;width:auto;display:block}
.logo-link{display:block;border-radius:6px;flex:none}
.btn-taller{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid #3a3a3a;color:#fff;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.btn-taller:hover{border-color:var(--amarillo);color:var(--amarillo)}
.btn-taller.on{border-color:var(--amarillo);color:var(--amarillo)}
@media (max-width:420px){.btn-taller span{display:none}.btn-taller{width:40px;padding:0;justify-content:center}.logo-img{height:38px}.topbar-in{gap:8px;padding:9px 12px}}
.topbar-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1180px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:8px;background:#fff;color:var(--azul);display:grid;place-items:center;font-family:var(--f-titulo);font-weight:700;font-size:17px;letter-spacing:.5px;flex:none}
.marca b{display:block;font-family:var(--f-titulo);font-size:20px;font-weight:600;line-height:1.1}
.marca span{font-size:13px;opacity:.85}
.topbar .spacer{flex:1}
.demo-tag{font-size:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:3px 8px;border-radius:999px;white-space:nowrap}
.layout{flex:1;display:flex;max-width:1180px;width:100%;margin:0 auto}
.side{display:none}
main{flex:1;min-width:0;padding:16px 16px calc(var(--nav-h) + 24px)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:#fff;border-top:1px solid var(--borde);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;min-height:44px}
.bottomnav a.on{color:var(--azul)}
.bottomnav a.on svg{stroke-width:2.4}
@media (min-width:900px){
  .bottomnav{display:none}
  .side{display:block;width:220px;flex:none;padding:20px 0 20px 16px}
  .side nav{position:sticky;top:80px;display:flex;flex-direction:column;gap:4px}
  .side a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;text-decoration:none;color:var(--texto);font-weight:500}
  .side a:hover{background:#e6ecf4}
  .side a.on{background:var(--negro);color:#fff;box-shadow:inset 4px 0 0 var(--amarillo)}
  main{padding:20px 24px 32px}
}
.foot{max-width:1180px;width:100%;margin:0 auto;padding:4px 16px calc(var(--nav-h) + 16px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted)}
@media (min-width:900px){.foot{padding-bottom:20px}}
.foot a{display:inline-flex;align-items:center;gap:6px;color:var(--wa-2);text-decoration:none;font-weight:600;border:1px solid #bfe3cc;border-radius:999px;padding:4px 10px;background:#fff}

/* ===== Componentes ===== */
.vhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.vhead h1{flex:1;min-width:0}
.vhead .sub{width:100%;color:var(--muted);font-size:14px;margin-top:-6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--radio);border:1px solid var(--borde);background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--texto);white-space:nowrap}
.btn:hover{border-color:#b8c4d3;background:#f8fafc}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.pri:hover{background:var(--azul-2)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{background:var(--wa-2)}
.btn.peligro{color:var(--danger);border-color:#f0c4bf}
.btn.peligro.lleno{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.chico{min-height:36px;padding:0 12px;font-size:14px}
.btn.icono{width:44px;padding:0}
.btn.bloque{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:16px}
.card + .card{margin-top:12px}
.card h3{margin-bottom:10px}
.grid2{display:grid;gap:12px}
@media (min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.stat:hover{border-color:var(--azul-borde)}
.stat b{display:block;font-family:var(--f-titulo);font-size:30px;font-weight:600;line-height:1.1;color:var(--negro)}
.stat{box-shadow:inset 0 3px 0 var(--amarillo)}
.stat span{font-size:13.5px;color:var(--muted)}
.stat.alerta b{color:var(--danger)}
.buscar{position:relative;margin-bottom:12px}
.buscar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.buscar input{width:100%;min-height:46px;border:1px solid var(--borde);border-radius:var(--radio);padding:0 12px 0 40px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--borde);background:#fff;font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--negro);border-color:var(--negro);color:#fff}
.chip .n{font-size:12px;background:rgba(0,0,0,.08);border-radius:999px;padding:0 7px}
.chip.on .n{background:rgba(255,255,255,.25)}
.lista{display:grid;gap:10px}
@media (min-width:700px){.lista.cols{grid-template-columns:1fr 1fr}}
.ot{display:block;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px;text-decoration:none;color:inherit}
.ot:hover{border-color:var(--azul-borde);background:#fbfdff}
.ot-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ot-veh{font-weight:600}
.ot-cli{color:var(--muted);font-size:14px}
.ot-tareas{font-size:14px;margin-top:6px;color:#2c3747}
.ot-bottom{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:13px;color:var(--muted);gap:8px}
.ot-bottom strong{font-family:var(--f-titulo);font-size:20px;color:var(--texto);font-weight:600}
.patente{display:inline-block;font-family:var(--f-titulo);font-weight:700;font-size:16px;letter-spacing:1.5px;background:#fff;color:#111;border:2px solid #222;border-top:6px solid #1d4f91;border-radius:5px;padding:0 8px;line-height:1.35}
.patente.grande{font-size:24px;padding:2px 12px}
.badge{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.e-ingresado{background:#eceff4;color:#3d4757}
.e-presupuestado{background:var(--warn-bg);color:var(--warn)}
.e-aprobado{background:#fde7e6;color:#9b1c17}
.e-reparacion{background:#ffe9d6;color:#94400f}
.e-listo{background:var(--ok-bg);color:var(--ok)}
.e-entregado{background:#e6e9ee;color:#4a5566}
.vacio{text-align:center;padding:36px 16px;color:var(--muted);background:#fff;border:1px dashed var(--borde);border-radius:12px}
.vacio p{margin:0 0 12px}
.muted{color:var(--muted)}
.chico-txt{font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* Stepper de estados */
.pasos{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.paso{flex:1 0 auto;min-height:44px;padding:6px 12px;border-radius:8px;border:1px solid var(--borde);background:#fff;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:6px}
.paso.hecho{color:var(--negro);border-color:var(--azul-borde);background:#fffbea}
.paso.actual{background:var(--negro);color:#fff;border-color:var(--negro)}
.paso.actual.listo{background:var(--ok);border-color:var(--ok)}

.h-queja{background:var(--danger-bg);color:var(--danger)}
.h-pend{background:var(--warn-bg);color:var(--warn)}
.h-gar{background:var(--azul-claro);color:var(--azul-2)}
.h-obs{background:#eceff4;color:#3d4757}
.alerta-hojas{background:#fff6ec;border:1px solid #f2c79c;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14.5px}
.alerta-hojas b{display:flex;align-items:center;gap:8px;color:#8a3f0a}
.alerta-hojas ul{margin:8px 0 0;padding-left:20px}
.alerta-hojas li{margin-top:4px}
.encontrado .alerta-hojas{width:100%;margin:4px 0 0}
.filtros{padding:0;margin-bottom:12px}
.filtros summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:600;min-height:48px}
.filtros summary::-webkit-details-marker{display:none}
.filtros summary .n{margin-left:auto;font-size:13px;color:var(--azul);font-weight:600}
.filtros-in{padding:0 16px 16px}
.filtros-in .campo{margin-bottom:10px}
.filtros-in .chips{margin-bottom:10px}
.resumen-hist{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.resumen-hist b{font-family:var(--f-titulo);font-size:22px;font-weight:600}
.hist .h-veh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.desc-hoja{white-space:pre-wrap;font-size:15.5px;margin:0}
.serv-rapidos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.serv-rapidos .chip{flex:0 1 auto;max-width:100%;white-space:normal;text-align:left;min-height:36px;padding:6px 12px;font-size:13.5px;line-height:1.25}
.serv-rapidos .chip svg{width:16px;height:16px;color:var(--rojo)}
.info-hero{background:var(--negro);border-radius:14px;padding:22px 18px;text-align:center;border-bottom:4px solid var(--amarillo);margin-bottom:12px}
.info-hero img{width:min(380px,90%);height:auto}
.servicios{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.servicios li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.servicios li svg{color:var(--rojo);margin-top:3px}
.red-gps{display:flex;gap:12px;align-items:center;background:var(--negro);color:#fff;border-radius:12px;padding:14px 16px;margin-top:12px}
.red-gps .ic{width:44px;height:44px;border-radius:50%;background:var(--amarillo);color:var(--negro);display:grid;place-items:center;flex:none}
.red-gps b{color:var(--amarillo)}
.pr-logo{height:56px;width:auto;display:block;margin-bottom:4px}
.pr-serv{margin-top:14px;font-size:11px;color:#333;border-top:1px solid #999;padding-top:8px}
.msg-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn.punteado{border-style:dashed;border-color:#c9b25a;color:var(--negro);background:#fffbea}
.msg-guardado{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borde);border-radius:10px;padding:10px 12px;margin-top:8px}
.msg-guardado div{flex:1;min-width:0}
.msg-guardado p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:pre-wrap;max-height:60px;overflow:hidden}
.check-fila{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}
.check-fila input{width:22px;height:22px;accent-color:var(--azul)}
.aviso-listo{background:var(--ok-bg);border:1px solid #b7e0c6;border-radius:12px;padding:16px;margin-bottom:12px}
.aviso-listo h3{color:var(--ok);margin-bottom:4px}
.aviso-listo .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.tareas{list-style:none;margin:0;padding:0}
.tareas li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #edf1f6}
.tareas li:last-child{border-bottom:0}
.tareas label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-height:36px}
.tareas input[type=checkbox]{width:22px;height:22px;accent-color:var(--azul);flex:none}
.tareas .hecha span{text-decoration:line-through;color:var(--muted)}
.total-box{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--texto);margin-top:10px;padding-top:10px}
.total-box b{font-family:var(--f-titulo);font-size:28px;font-weight:700}

.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.foto{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--borde);background:#eef2f7}
.foto img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.foto button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.foto button svg{width:16px;height:16px}
.add-foto{aspect-ratio:1;border:2px dashed var(--azul-borde);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--negro);font-size:13px;font-weight:600;cursor:pointer;background:#fffbea}
.add-foto input{display:none}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 12px 22px;font-size:14px}
.timeline li::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--azul)}
.timeline li::after{content:"";position:absolute;left:9px;top:16px;bottom:0;width:1px;background:var(--borde)}
.timeline li:last-child::after{display:none}

.hist{display:grid;gap:8px}
.hist a{display:block;text-decoration:none;color:inherit;border:1px solid var(--borde);border-radius:10px;padding:12px;background:#fff}
.hist a:hover{border-color:var(--azul-borde)}
.hist .h-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.hist .h-t{margin-top:4px}
.hist .h-tot{font-family:var(--f-titulo);font-weight:600;font-size:18px;color:var(--texto)}

.svc{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.svc .badge{margin-left:auto}

/* ===== Formularios ===== */
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo label{font-weight:600;font-size:14.5px}
.campo .ayuda{font-size:13px;color:var(--muted)}
.campo input,.campo select,.campo textarea{min-height:46px;border:1px solid #c9d3df;border-radius:var(--radio);padding:10px 12px;background:#fff;width:100%}
.campo textarea{min-height:96px;resize:vertical}
.campo input.patente-in{font-family:var(--f-titulo);font-size:22px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.campo .err-msg{color:var(--danger);font-size:13px;display:none}
.campo.err input,.campo.err select,.campo.err textarea{border-color:var(--danger);background:#fffafa}
.campo.err .err-msg{display:block}
.fila{display:grid;gap:0 12px}
@media (min-width:560px){.fila{grid-template-columns:1fr 1fr}.fila.tres{grid-template-columns:1fr 1fr 1fr}}
.add-tarea{display:flex;gap:8px}
.add-tarea input{flex:1;min-width:0}
.tarea-ed{display:flex;align-items:center;gap:8px;background:#f6f8fb;border:1px solid var(--borde);border-radius:8px;padding:6px 6px 6px 12px;margin-top:8px}
.tarea-ed span{flex:1;min-width:0;overflow-wrap:anywhere}
.encontrado{background:var(--azul-claro);border:1px solid var(--azul-borde);border-radius:10px;padding:12px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.form-acc{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.errores{background:var(--danger-bg);border:1px solid #f3c1bb;color:var(--danger);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14.5px}
.errores ul{margin:4px 0 0;padding-left:18px}
.wa-num{font-size:13.5px;margin-top:2px}
.wa-num.ok{color:var(--ok)} .wa-num.mal{color:var(--danger)}
fieldset{border:0;padding:0;margin:0}
legend{font-family:var(--f-titulo);font-size:18px;font-weight:600;margin-bottom:10px;padding:0}

/* ===== Modal y toast ===== */
.modal-fondo{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:600px){.modal-fondo{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:600px){.modal{border-radius:16px}}
.modal-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal-h h2{flex:1}
.modal-img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
@media (min-width:900px){.toasts{bottom:24px}}
.toast{background:#17212e;color:#fff;padding:12px 16px;border-radius:10px;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.error{background:var(--danger)}
.toast.ok{background:var(--ok)}

/* ===== Bloqueo con PIN ===== */
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 20px;background:var(--negro)}
.lock-logo{width:min(320px,86vw);height:auto;display:block}
.lock-info{color:#bdbdbd;font-size:13.5px;text-align:center;line-height:1.6;max-width:360px}
.lock-info b{color:var(--amarillo);font-weight:600}
.lock-card{background:#fff;border-radius:16px;padding:28px 22px;width:100%;max-width:360px;text-align:center}
.lock-card .logo{width:64px;height:64px;font-size:26px;margin:0 auto 12px;background:var(--azul);color:#fff}
.lock-card input{width:100%;min-height:54px;font-size:28px;letter-spacing:12px;text-align:center;border:1px solid #c9d3df;border-radius:10px;margin:16px 0 10px;font-family:var(--f-titulo)}
.lock-card .err-txt{color:var(--danger);font-size:14px;min-height:20px}

/* ===== Comprobante (impresión) ===== */
#print-area{display:none}
@media print{
  body{background:#fff}
  .app,.modal-fondo,.toasts,.lock{display:none!important}
  #print-area{display:block;font-family:var(--f-texto);color:#000;padding:10mm}
}
.comp{border:1px solid var(--borde);border-radius:10px;padding:14px;font-size:14px;background:#fff;color:#000}
.pr-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
.pr-h h1{font-size:24px}
.pr-t{width:100%;border-collapse:collapse;margin:10px 0}
.pr-t td,.pr-t th{border-bottom:1px solid #999;padding:6px 4px;text-align:left;font-size:13px;vertical-align:top}
.pr-tot{text-align:right;font-size:20px;font-weight:700;margin-top:8px}
.pr-firma{margin-top:36px;display:flex;justify-content:space-between;gap:16px;font-size:12px}
.pr-firma div{border-top:1px solid #000;flex:1;padding-top:4px;text-align:center}
.pr-pie{margin-top:20px;font-size:10px;color:#555;text-align:center}
</style>

/* ---------- WhatsApp: normalizar número argentino ----------
   Acepta "2972 412345", "02972 15412345", "+54 9 2972 412345", etc.
   Devuelve "549XXXXXXXXXX" (13 dígitos) o null si no es válido. */
function normalizarWA(tel){
  let d = String(tel||'').replace(/\D/g,'');
  if (!d) return null;
  if (d.startsWith('549') && d.length === 13) return d;
  if (d.startsWith('54')) { d = d.slice(2); if (d.startsWith('9')) d = d.slice(1); }
  if (d.startsWith('0')) d = d.slice(1);
  if (d.length === 12) {               // tiene el "15" después del código de área
    for (const largo of [4,3,2]) {
      if (d.substr(largo,2) === '15') { d = d.slice(0,largo) + d.slice(largo+2); break; }
    }
  }
  return d.length === 10 ? '549' + d : null;
}
const mostrarWA = (n) => n ? `+54 9 ${n.slice(3,7)} ${n.slice(7)}` : '';

/* Completa campos nuevos en datos guardados con una versión anterior */
function migrar(){
  const k = db.config;
  if (k.taller === 'Taller CKP') k.taller = DATOS_TALLER.taller;
  if (k.direccion === 'Av. San Martín 1234, Junín de los Andes') k.direccion = DATOS_TALLER.direccion;

  if (!Array.isArray(k.servicios)) k.servicios = [...DATOS_TALLER.servicios];

/* Próximo service por vehículo: el último dato cargado */
function servicesPendientes(){
  const res = [];
  const hoy = new Date().toISOString().slice(0,10);
  for (const v of db.vehiculos){
    const ords = ordenesDeVeh(v.id);
    const conProx = ords.find(o => o.proxKm || o.proxFecha);
    if (!conProx) continue;
    // si el auto volvió y se ENTREGÓ una orden posterior, ese service se considera hecho
    const posterior = ords.find(o => o.fechaIngreso > conProx.fechaIngreso && o.estado === 'Entregado');
    if (posterior) continue;
    let nivel = 'ok', dias = null;
    if (conProx.proxFecha){
      dias = Math.round((new Date(conProx.proxFecha+'T12:00:00') - new Date(hoy+'T12:00:00'))/86400000);
      nivel = dias < 0 ? 'vencido' : dias <= CONFIG.DIAS_AVISO_SERVICE ? 'proximo' : 'ok';
    }
    res.push({v, o:conProx, nivel, dias, ultimoKm: Math.max(...ords.map(x => Number(x.km)||0))});
  }
  const peso = {vencido:0, proximo:1, ok:2};
  return res.sort((a,b) => peso[a.nivel]-peso[b.nivel] || (a.dias??9999)-(b.dias??9999));
}

/* Datos que se reemplazan en las plantillas. La orden puede ser null (mensaje general). */
function datosMensaje(o, c){
  const v = o ? vehiculo(o.vehiculoId) : null;
  c = c || cliente(v?.clienteId);
  const primerNombre = (c?.nombre||'').trim().split(' ')[0] || 'cliente';
  return {
    cliente: primerNombre.charAt(0).toUpperCase() + primerNombre.slice(1),
    vehiculo: v ? nombreVeh(v) : 'vehículo', patente: v?.patente||'',
    trabajos: o ? (o.tareas.map(t => '- ' + t.texto).join('\n') || '- (sin detalle)') : '',
    total: o ? plata(o.total) : '', taller: db.config.taller, direccion: db.config.direccion,
    orden: o ? nroOrden(o.numero) : '', km: o ? miles(o.km) : '',
    horario: (db.config.horario||'').replace(/^./, m => m.toLowerCase()), email: db.config.email||'', telefono: db.config.telefono||''
  };
}
function armarMensaje(plantilla, o, c){
  const d = datosMensaje(o, c);
  return String(plantilla||'').replace(/\{(\w+)\}/g, (m,k) => k in d ? d[k] : m);
}
const mensajeListo = (o) => armarMensaje(db.config.plantilla || PLANTILLA_DEFECTO, o);
/* Al guardar un mensaje escrito a mano, los datos concretos vuelven a ser {campos} para reusarlo con otros clientes */
function aPlantilla(texto, o, c){
  const d = datosMensaje(o, c);
  const pares = ['trabajos','vehiculo','direccion','taller','total','patente','cliente'].map(k => [k, d[k]]).filter(([k,v]) => v && String(v).length > 1).sort((a,b) => String(b[1]).length - String(a[1]).length);
  let t = texto;
  for (const [k,v] of pares) t = t.split(v).join('{'+k+'}');
  return t;
}

let filtroEstado = 'activos', busqTaller = '';
function filtrarOrdenes(){
  const q = sinAcentos(busqTaller.trim()), qp = normPatente(busqTaller);
  return db.ordenes.filter(o => {
    if (filtroEstado === 'activos' && o.estado === 'Entregado') return false;
    if (filtroEstado !== 'activos' && filtroEstado !== 'todos' && o.estado !== filtroEstado) return false;
    if (!q) return true;
    const v = vehiculo(o.vehiculoId), c = cliente(v?.clienteId);
    const texto = sinAcentos([nombreVeh(v), c?.nombre, c?.telefono, o.tareas.map(t=>t.texto).join(' '), nroOrden(o.numero)].join(' '));
    return texto.includes(q) || (qp && normPatente(v?.patente).includes(qp)) || (qp && String(c?.telefono||'').replace(/\D/g,'').includes(qp));
  }).sort((a,b) => {
    const pa = CONFIG.ESTADOS.indexOf(a.estado), pb = CONFIG.ESTADOS.indexOf(b.estado);
    if (filtroEstado === 'activos' && pa !== pb) return pb - pa; // listos primero
    return b.fechaIngreso.localeCompare(a.fechaIngreso);
  });
}
function tarjetaOrden(o){
  const v = vehiculo(o.vehiculoId), c = cliente(v?.clienteId);
  const t = o.tareas.slice(0,2).map(x => esc(x.texto)).join(' · ');
  const mas = o.tareas.length > 2 ? ` <span class="muted">+${o.tareas.length-2} más</span>` : '';
  return `<a class="ot" href="#orden-${o.id}">
    <div class="ot-top">${patenteHTML(v?.patente||'—')}${badge(o.estado)}</div>
    <div class="ot-veh">${esc(nombreVeh(v))}</div>
    <div class="ot-cli">${esc(c?.nombre||'Sin cliente')}${(() => { const n = hojasAbiertas(v?.id).length; return n ? ` · <span class="badge h-pend">${n} ${n===1?'hoja abierta':'hojas abiertas'}</span>` : ''; })()}</div>
    <div class="ot-tareas">${t || '<span class="muted">Sin tareas cargadas</span>'}${mas}</div>
    <div class="ot-bottom"><span>${nroOrden(o.numero)} · ${o.estado==='Entregado' ? 'entregado '+fecha(o.fechaEntrega) : 'ingresó '+hace(o.fechaIngreso)}</span><strong>${o.total ? plata(o.total) : '<span class="muted" style="font-size:14px">Sin monto</span>'}</strong></div>

}

const ordenesDeCli = (cid) => { const ids = vehiculosDeCli(cid).map(v => v.id); return db.ordenes.filter(o => ids.includes(o.vehiculoId)).sort((a,b) => b.fechaIngreso.localeCompare(a.fechaIngreso)); };
const ordenSugerida = (cid) => { const os = ordenesDeCli(cid); return os.find(o => o.estado === 'Listo') || os.find(o => o.estado !== 'Entregado') || os[0] || null; };
function plantillaDe(tipo){
  if (tipo === 'listo') return db.config.plantilla || PLANTILLA_DEFECTO;
  if (tipo === 'demora') return db.config.plantillaDemora || PLANTILLA_DEMORA;
  if (tipo.startsWith('m:')) return db.mensajes.find(m => 'm:'+m.id === tipo)?.texto || '';
  return 'Hola {cliente}! Te escribimos de {taller}.\n\n';
}
function nombreTipo(tipo){
  if (tipo === 'listo') return 'Auto listo';
  if (tipo === 'demora') return 'Se queda más tiempo';
  if (tipo.startsWith('m:')) return db.mensajes.find(m => 'm:'+m.id === tipo)?.titulo || 'Mensaje';
  return 'Mensaje personalizado';

/* Fila de botones de mensajes (ficha del cliente y detalle de la orden) */

/* Modal: arma el mensaje, se puede retocar y se abre WhatsApp (app o Web). No es un bot: lo envían ellos. */
function abrirMensaje({cid, oid, tipo, recienListo=false}){
  const c = cliente(cid);
  const num = normalizarWA(c?.telefono);
  if (!num){
    abrirModal('Falta el WhatsApp', `<p>El número de ${esc(c?.nombre||'este cliente')} no es válido${c?.telefono ? ` («${esc(c.telefono)}»)` : ''}. Cargalo con código de área, por ejemplo <b>2972 412345</b>.</p>
      <div class="form-acc"><button class="btn" data-act="cerrar-modal">Cerrar</button>${c ? `<button class="btn pri" data-act="editar-cliente" data-id="${c.id}">Corregir número</button>` : ''}</div>`);
    return;
  }
  const ords = ordenesDeCli(cid);
  const necesitaOrden = tipo === 'listo' || tipo === 'demora';
  let sel = oid ? orden(oid) : ordenSugerida(cid);
  if (necesitaOrden && !sel){ toast('Este cliente todavía no tiene órdenes cargadas','error'); return; }
  const esNuevo = tipo === 'nuevo';
  const titulo = recienListo ? '¡Auto listo! Avisale al cliente' : tipo === 'listo' ? 'Auto listo para retirar' : tipo === 'demora' ? 'Avisar que se queda más tiempo' : esNuevo ? 'Crear mensaje personalizado' : esc(nombreTipo(tipo));
  const elegirAuto = !oid && ords.length > 1;
  const opciones = (esNuevo || !necesitaOrden ? `<option value="">Sin auto (mensaje general)</option>` : '') +
    ords.map(o => { const v = vehiculo(o.vehiculoId); return `<option value="${o.id}" ${sel?.id===o.id?'selected':''}>${esc(v?.patente)} · ${esc(nombreVeh(v))} · ${esc(o.estado)}</option>`; }).join('');
  const texto = armarMensaje(plantillaDe(tipo), sel, c);
  abrirModal(titulo, `
    <p class="chico-txt" style="margin-top:0">Para <b>${esc(c.nombre)}</b> (${mostrarWA(num)}). Se abre WhatsApp con el mensaje escrito y solo tocás <b>Enviar</b>.</p>
    ${elegirAuto ? `<div class="campo"><label for="cm-orden">¿De qué auto es el mensaje?</label><select id="cm-orden">${opciones}</select></div>` : ''}
    <div class="campo"><label for="wa-txt">${esNuevo ? 'Escribí el mensaje' : 'Mensaje (lo podés retocar)'}</label>
      <textarea id="wa-txt" rows="9" style="min-height:200px">${esc(texto)}</textarea></div>
    ${esNuevo ? `
    <label class="check-fila"><input type="checkbox" id="cm-guardar"> Guardar este mensaje como botón para reusarlo</label>
    <div class="campo" id="cm-c-nombre" hidden><label for="cm-nombre">Nombre del botón</label><input id="cm-nombre" maxlength="40" placeholder="Ej.: Falta un repuesto"><span class="err-msg">Ponele un nombre al botón.</span></div>` : ''}
    <div class="form-acc" style="justify-content:stretch">
      <a class="btn wa" style="flex:1" id="wa-app" href="#" target="_blank" rel="noopener">${ico('wa')}Abrir WhatsApp</a>
      <a class="btn" style="flex:1" id="wa-web" href="#" target="_blank" rel="noopener">${ico('web')}WhatsApp Web</a>
    </div>
    ${esNuevo ? `<button class="btn bloque" style="margin-top:8px" id="cm-solo-guardar">${ico('check')}Guardar el botón sin enviar</button>` : ''}`);
  const ta = $('#wa-txt');
  let editado = false;
  const actualizar = () => { $('#wa-app').href = linkWA(num, ta.value); $('#wa-web').href = linkWAWeb(num, ta.value); };
  actualizar();
  ta.addEventListener('input', () => { editado = true; actualizar(); });
  $('#cm-orden')?.addEventListener('change', (e) => {
    sel = e.target.value ? orden(e.target.value) : null;
    if (!esNuevo && (!editado || true)){ ta.value = armarMensaje(plantillaDe(tipo), sel, c); editado = false; actualizar(); }
  });
  $('#cm-guardar')?.addEventListener('change', (e) => { $('#cm-c-nombre').hidden = !e.target.checked; if (e.target.checked) $('#cm-nombre').focus(); });
  /* Guarda el mensaje personalizado como botón. Devuelve false si falta el nombre. */
  const guardarBoton = () => {
    if (!$('#cm-guardar')?.checked) return true;
    const nom = $('#cm-nombre').value.trim();
    if (!nom){ $('#cm-c-nombre').classList.add('err'); $('#cm-nombre').focus(); return false; }
    db.mensajes.push({id:uid(), titulo:nom, texto:aPlantilla(ta.value, sel, c)});
    guardar(); return true;
  };
  $('#cm-nombre')?.addEventListener('input', () => $('#cm-c-nombre').classList.remove('err'));
  $('#cm-solo-guardar')?.addEventListener('click', () => {
    if (!$('#cm-guardar').checked){ $('#cm-guardar').checked = true; $('#cm-c-nombre').hidden = false; }
    if (!$('#cm-nombre').value.trim()){ $('#cm-c-nombre').classList.add('err'); $('#cm-nombre').focus(); return; }
    guardarBoton(); cerrarModal(); render(); toast('Botón guardado','ok');
  });
  const registrar = (e) => {
    if (!ta.value.trim()){ e.preventDefault(); toast('Escribí el mensaje primero','error'); ta.focus(); return; }
    if (!guardarBoton()){ e.preventDefault(); return; }
    if (sel){ sel.avisos = sel.avisos || []; sel.avisos.push({fecha:new Date().toISOString(), tipo:nombreTipo(tipo)}); }
    guardar();
    setTimeout(() => { cerrarModal(); render(); toast(sel ? 'Mensaje registrado en la orden ' + nroOrden(sel.numero) : 'Mensaje abierto en WhatsApp','ok'); }, 300);
  };
  $('#wa-app').addEventListener('click', registrar);
  $('#wa-web').addEventListener('click', registrar);
}

/* Fotos: se comprimen antes de guardar */
function comprimir(file){
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image();
      img.onload = () => { const max = 900; let w = img.width, h = img.height;
        if (w > h && w > max){ h = h*max/w; w = max; } else if (h > max){ w = w*max/h; h = max; }
        const cv = document.createElement('canvas'); cv.width = Math.round(w); cv.height = Math.round(h);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); ok(cv.toDataURL('image/jpeg', 0.6)); };
      img.onerror = mal; img.src = fr.result; };
    fr.onerror = mal; fr.readAsDataURL(file);
  });
}
async function leerFotos(files){
  const res = [];
  for (const f of files){ if (!f.type.startsWith('image/')) continue; try { res.push(await comprimir(f)); } catch(e){ toast('No se pudo leer una de las fotos','error'); } }
  return res;
}

vForm.despues = (r) => {
  pintarTareas(); pintarFotosForm();

  if (pat){ pat.addEventListener('input', () => { pat.value = pat.value.toUpperCase(); buscarPatente(); }); }

  $('#f-tarea').addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); agregarTarea(); } });

  $('#f-ctel')?.addEventListener('input', previewTel);
  $('#f-total').addEventListener('input', (e) => { const n = Number(String(e.target.value).replace(/\D/g,'')); $('#f-total-prev').textContent = n ? plata(n) : 'Podés dejarlo vacío hasta presupuestar.'; });
  $('#form-orden').addEventListener('submit', guardarOrden);

function previewTel(){
  const n = normalizarWA($('#f-ctel').value), el = $('#f-ctel-prev');
  if (!$('#f-ctel').value){ el.textContent = ''; el.className='wa-num'; return; }
  el.textContent = n ? 'Se enviará a ' + mostrarWA(n) : 'Falta el código de área (ej.: 2972 412345)';
  el.className = 'wa-num ' + (n ? 'ok' : 'mal');
}
function buscarPatente(){
  const box = $('#veh-encontrado'), nuevo = $('#veh-nuevo');
  let v = null;
  if (F.editando) v = vehiculo(F.vehiculoId);
  else {
    const p = normPatente($('#f-patente')?.value);
    v = p.length >= 6 ? db.vehiculos.find(x => normPatente(x.patente) === p) : null;
  }
  if (v){
    const c = cliente(v.clienteId), n = ordenesDeVeh(v.id).length;
    F.vehiculoId = v.id;
    box.innerHTML = `<div class="encontrado">${patenteHTML(v.patente)}<div style="flex:1;min-width:180px"><b>${esc(nombreVeh(v))}</b><div class="chico-txt">${esc(c?.nombre||'Sin cliente')} · ${esc(c?.telefono||'')}${F.editando?'':` · ${n} ${n===1?'orden anterior':'órdenes anteriores'}`}</div></div>${F.editando?'':`<a class="btn chico" href="#vehiculo-${v.id}">Ver historial</a>`}${alertaHojasHTML(v.id)}</div>`;
    nuevo.hidden = true;
  } else {
    F.vehiculoId = null; box.innerHTML = '';
    const p = normPatente($('#f-patente')?.value);
    nuevo.hidden = p.length < 6;
    if (p.length >= 6 && !box.dataset.aviso){ }
    $('#cli-nuevo').hidden = !!$('#f-cliente').value;
  }
}

function agregarTarea(){
  const inp = $('#f-tarea'), t = inp.value.trim();
  if (!t){ inp.focus(); return; }
  F.tareas.push({id:uid(), texto:t, hecha:false});

function pintarTareas(){
  $('#lista-tareas').innerHTML = F.tareas.length
    ? F.tareas.map((t,i) => `<div class="tarea-ed"><span>${i+1}. ${esc(t.texto)}</span><button type="button" class="btn icono chico" style="width:36px" data-act="quitar-tarea" data-i="${i}" aria-label="Quitar ${esc(t.texto)}">${ico('cerrar')}</button></div>`).join('')
    : `<p class="muted chico-txt" style="margin:8px 0 0">Todavía no agregaste trabajos.</p>`;
}
function pintarFotosForm(){
  $('#f-fotos').innerHTML = F.fotos.map((f,i) => `<div class="foto"><img src="${f}" alt="Foto ${i+1}"><button type="button" data-act="quitar-foto-form" data-i="${i}" aria-label="Quitar foto ${i+1}">${ico('cerrar')}</button></div>`).join('')
    + `<label class="add-foto">${ico('camara')}<span>Agregar</span><input type="file" accept="image/*" capture="environment" multiple data-act="foto-form"></label>`;
}
function marcarError(id, on){ const el = $('#'+id); if (el) el.classList.toggle('err', on); }
function guardarOrden(e){
  e.preventDefault();
  const errores = [];
  ['c-patente','c-marca','c-modelo','c-cnombre','c-ctel','c-tareas','c-total'].forEach(id => marcarError(id,false));
  const pendiente = $('#f-tarea').value.trim();
  if (pendiente){ F.tareas.push({id:uid(), texto:pendiente, hecha:false}); $('#f-tarea').value=''; pintarTareas(); }

  let vehId = F.vehiculoId, nuevoVeh = null, nuevoCli = null;
  if (!F.editando && !vehId){
    const p = normPatente($('#f-patente').value);
    if (p.length < 6 || p.length > 9){ errores.push('La patente no es válida.'); marcarError('c-patente',true); }
    const marca = $('#f-marca').value.trim(), modelo = $('#f-modelo').value.trim();
    if (!marca){ errores.push('Falta la marca.'); marcarError('c-marca',true); }
    if (!modelo){ errores.push('Falta el modelo.'); marcarError('c-modelo',true); }
    let cliId = $('#f-cliente').value;
    if (!cliId){
      const nom = $('#f-cnombre').value.trim(), tel = $('#f-ctel').value.trim();
      if (!nom){ errores.push('Falta el nombre del cliente.'); marcarError('c-cnombre',true); }
      if (!normalizarWA(tel)){ errores.push('El WhatsApp del cliente no es válido (poné código de área).'); marcarError('c-ctel',true); }
      if (nom && normalizarWA(tel)){ nuevoCli = {id:uid(), nombre:nom, telefono:tel, notas:'', creado:new Date().toISOString()}; cliId = nuevoCli.id; }
    }
    if (!errores.length) nuevoVeh = {id:uid(), clienteId:cliId, patente:p, tipo:$('#f-tipo').value, marca, modelo, anio:$('#f-anio').value.trim(), color:$('#f-color').value.trim(), vin:$('#f-vin').value.trim(), motor:$('#f-motor').value.trim()};
  }
  if (!F.tareas.length){ errores.push('Agregá al menos un trabajo.'); marcarError('c-tareas',true); }
  const totalTxt = $('#f-total').value.trim();
  const total = Number(totalTxt.replace(/\./g,'').replace(',','.')) || 0;
  if (totalTxt && (isNaN(Number(totalTxt.replace(/\./g,'').replace(',','.'))) || total < 0)){ errores.push('El monto no es válido.'); marcarError('c-total',true); }

  const box = $('#f-errores');
  if (errores.length){
    box.hidden = false; box.innerHTML = `<b>Revisá estos datos:</b><ul>${errores.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    box.focus(); box.scrollIntoView({behavior:'smooth', block:'center'}); return;
  }
  if (nuevoCli) db.clientes.push(nuevoCli);
  if (nuevoVeh){ db.vehiculos.push(nuevoVeh); vehId = nuevoVeh.id; }
  const datos = {
    tareas:F.tareas, total:Math.round(total), km:$('#f-km').value.replace(/\D/g,''), fotos:F.fotos,
    notas:$('#f-notas').value.trim(), proxKm:$('#f-proxkm').value.replace(/\D/g,''), proxFecha:$('#f-proxfecha').value
  };
  let id;
  if (F.editando){ Object.assign(orden(F.ordenId), datos); id = F.ordenId; }
  else {
    const est = $('#f-estado').value, ahora = new Date().toISOString();
    const hist = CONFIG.ESTADOS.slice(0, CONFIG.ESTADOS.indexOf(est)+1).map(e => ({estado:e, fecha:ahora}));
    const nueva = Object.assign({id:uid(), numero:db.proximoNumero++, vehiculoId:vehId, fechaIngreso:ahora, estado:est, historial:hist, avisos:[], fechaEntrega:''}, datos);
    db.ordenes.push(nueva); id = nueva.id;
  }
  if (!guardar()) return;
  toast(F.editando ? 'Cambios guardados' : 'Orden creada', 'ok');
  ir('#orden-' + id);
}

/* =========================================================
   VISTA: HISTORIAL (órdenes y hojas con filtros)
   ========================================================= */
const H_DEF = {tab:'ordenes', q:'', periodo:'todo', desde:'', hasta:'', por:'ingreso', tipo:'', marca:'', estado:'', tipoHoja:'', soloAbiertas:false};
let H = {...H_DEF}, hFiltrosAbiertos = true;
function lunesKey(){ const d = new Date(hoyKey()+'T12:00:00'); d.setDate(d.getDate() - (d.getDay()+6)%7); return d.toISOString().slice(0,10); }
function enPeriodo(key){
  if (!key) return false;
  const hoy = hoyKey();
  switch(H.periodo){
    case 'hoy': return key === hoy;
    case 'semana': return key >= lunesKey() && key <= hoy;
    case 'mes': return key.slice(0,7) === hoy.slice(0,7);
    case 'anio': return key.slice(0,4) === hoy.slice(0,4);
    case 'rango': return (!H.desde || key >= H.desde) && (!H.hasta || key <= H.hasta);
    default: return true;
  }
}
const fechaRefOrden = (o) => H.por === 'entrega' ? o.fechaEntrega : o.fechaIngreso;
function coincideVeh(v){
  if (H.tipo && v?.tipo !== H.tipo) return false;
  if (H.marca && v?.marca !== H.marca) return false;
  if (H.soloAbiertas && !hojasAbiertas(v?.id).length) return false;
  return true;
}
function histOrdenes(){
  const q = sinAcentos(H.q.trim()), qp = normPatente(H.q);
  return db.ordenes.filter(o => {
    const v = vehiculo(o.vehiculoId), c = cliente(v?.clienteId), ref = fechaRefOrden(o);
    if (H.por === 'entrega' && !ref) return false;
    if (!enPeriodo(diaKey(ref))) return false;
    if (H.estado && o.estado !== H.estado) return false;
    if (!coincideVeh(v)) return false;
    if (q){ const t = sinAcentos([nombreVeh(v), c?.nombre, c?.telefono, o.tareas.map(x=>x.texto).join(' '), nroOrden(o.numero), o.notas].join(' '));
      if (!t.includes(q) && !(qp && normPatente(v?.patente).includes(qp))) return false; }
    return true;
  }).sort((a,b) => (fechaRefOrden(b)||'').localeCompare(fechaRefOrden(a)||''));
}
function histHojas(){
  const q = sinAcentos(H.q.trim()), qp = normPatente(H.q);
  return db.hojas.filter(h => {
    const v = vehiculo(h.vehiculoId), c = cliente(v?.clienteId);
    if (!enPeriodo(h.fecha)) return false;
    if (H.estado && h.estado !== H.estado) return false;
    if (H.tipoHoja && h.tipo !== H.tipoHoja) return false;
    if (H.tipo && v?.tipo !== H.tipo) return false;
    if (H.marca && v?.marca !== H.marca) return false;
    if (H.soloAbiertas && h.estado !== 'Abierta') return false;
    if (q){ const t = sinAcentos([nombreVeh(v), c?.nombre, c?.telefono, h.descripcion, h.tipo, h.resolucion].join(' '));
      if (!t.includes(q) && !(qp && normPatente(v?.patente).includes(qp))) return false; }
    return true;
  }).sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
}

function filasHistorial(){
  if (H.tab === 'ordenes'){
    const f = [['Orden','Ingreso','Entrega','Estado','Patente','Tipo','Vehículo','Cliente','WhatsApp','Km','Trabajos','Total']];
    histOrdenes().forEach(o => { const v = vehiculo(o.vehiculoId), c = cliente(v?.clienteId);

    return f;
  }
  const f = [['Fecha','Tipo','Estado','Patente','Vehículo','Cliente','Orden','Descripción','Recordar','Resolución']];
  histHojas().forEach(h => { const v = vehiculo(h.vehiculoId), c = cliente(v?.clienteId), o = h.ordenId ? orden(h.ordenId) : null;
    f.push([fechaD(h.fecha), h.tipo, h.estado, v?.patente||'', nombreVeh(v), c?.nombre||'', o?nroOrden(o.numero):'', h.descripcion, h.recordar?fechaD(h.recordar):'', h.resolucion||'']); });
  return f;
}
function textoFiltros(){
  const p = PERIODOS.find(x => x[0] === H.periodo)?.[1];
  const partes = [H.tab === 'ordenes' ? 'Órdenes' : 'Hojas'];
  if (H.periodo === 'rango') partes.push(`del ${H.desde?fechaD(H.desde):'inicio'} al ${H.hasta?fechaD(H.hasta):'hoy'}`); else partes.push(p);
  if (H.tab === 'ordenes') partes.push('por fecha de ' + H.por);
  ['tipo','marca','estado','tipoHoja'].forEach(k => H[k] && partes.push(H[k]));
  if (H.soloAbiertas) partes.push('con hojas abiertas');
  if (H.q) partes.push(`«${H.q}»`);
  return partes.join(' · ');
}

function copiarTSV(filas){

    case 'filtro': filtroEstado = el.dataset.f; render(); break;
    case 'estado': if (o && ruta().v === 'orden'){ const n = el.dataset.e;
        if (CONFIG.ESTADOS.indexOf(n) < CONFIG.ESTADOS.indexOf(o.estado)) confirmar('Volver a un estado anterior', `¿Pasar la orden de «${esc(o.estado)}» a «${esc(n)}»?`, 'Sí, cambiar', () => cambiarEstado(o,n), false);
        else cambiarEstado(o, n); } break;
    case 'wa': if (o) abrirWA(o); break;
    case 'tarea': if (o){ const t = o.tareas.find(x => x.id === el.dataset.t); if (t){ t.hecha = el.checked; guardar(); el.closest('li').classList.toggle('hecha', t.hecha); } } break;
    case 'imprimir': if (o) imprimir(o); break;
    case 'borrar-orden': if (o) confirmar('Borrar orden', `Se va a borrar la orden ${nroOrden(o.numero)} con sus fotos. Esto no se puede deshacer.`, 'Borrar', () => { db.ordenes = db.ordenes.filter(x => x.id !== o.id); db.hojas.forEach(h => { if (h.ordenId === o.id) h.ordenId = ''; }); guardar(); toast('Orden borrada'); ir('#taller'); }); break;
    case 'ver-foto': if (o) abrirModal('Foto', `<img class="modal-img" src="${o.fotos[+el.dataset.i]}" alt="Foto de la orden">`); break;
    case 'borrar-foto': if (o) confirmar('Borrar foto', '¿Borrar esta foto de la orden?', 'Borrar', () => { o.fotos.splice(+el.dataset.i,1); guardar(); render(); }); break;
    case 'add-tarea': agregarTarea(); break;
    case 'add-servicio': { const t = el.dataset.s; if (F.tareas.some(x => x.texto === t)) { toast('Ese trabajo ya está en la lista'); break; }
        F.tareas.push({id:uid(), texto:t, hecha:false}); pintarTareas(); $('#c-tareas').classList.remove('err'); toast('Agregado: ' + t, 'ok'); } break;
    case 'compartir-info': break;
    case 'quitar-tarea': F.tareas.splice(+el.dataset.i,1); pintarTareas(); break;
    case 'quitar-foto-form': F.fotos.splice(+el.dataset.i,1); pintarFotosForm(); break;
    case 'prox': { const m = +el.dataset.m, d = new Date(); d.setMonth(d.getMonth()+m); $('#f-proxfecha').value = d.toISOString().slice(0,10); } break;
    case 'prox-km': { const km = Number($('#f-km').value.replace(/\D/g,'')); if (!km){ toast('Cargá primero los km del vehículo','error'); $('#f-km').focus(); } else $('#f-proxkm').value = km + Number(el.dataset.k); } break;
    case 'editar-vehiculo': modalVehiculo(el.dataset.id); break;
    case 'borrar-vehiculo': { const v = vehiculo(el.dataset.id), n = ordenesDeVeh(v.id).length;
        if (n) abrirModal('No se puede borrar', `<p>Este vehículo tiene ${n} ${n===1?'orden':'órdenes'} en su historial. Borrá primero las órdenes si de verdad querés eliminarlo.</p><div class="form-acc"><button class="btn pri" data-act="cerrar-modal">Entendido</button></div>`);
        else confirmar('Borrar vehículo', `¿Borrar ${esc(nombreVeh(v))} (${esc(v.patente)})?`, 'Borrar', () => { db.vehiculos = db.vehiculos.filter(x => x.id !== v.id); db.hojas = db.hojas.filter(h => h.vehiculoId !== v.id); guardar(); ir('#vehiculos'); toast('Vehículo borrado'); }); } break;
    case 'nuevo-cliente': modalCliente(null); break;
    case 'editar-cliente': cerrarModal(); modalCliente(el.dataset.id); break;
    case 'borrar-cliente': { const c = cliente(el.dataset.id), n = vehiculosDeCli(c.id).length;
        if (n) abrirModal('No se puede borrar', `<p>${esc(c.nombre)} tiene ${n} ${n===1?'vehículo':'vehículos'} a su nombre. Pasalos a otro dueño o borralos primero.</p><div class="form-acc"><button class="btn pri" data-act="cerrar-modal">Entendido</button></div>`);
        else confirmar('Borrar cliente', `¿Borrar a ${esc(c.nombre)}?`, 'Borrar', () => { db.clientes = db.clientes.filter(x => x.id !== c.id); guardar(); ir('#clientes'); toast('Cliente borrado'); }); } break;
    case 'nueva-hoja': modalHoja({vid:el.dataset.vid, oid:el.dataset.oid || ''}); break;
    case 'editar-hoja': modalHoja({id:el.dataset.id}); break;
    case 'borrar-hoja': { const h = hoja(el.dataset.id); if (h) confirmar('Borrar hoja', `¿Borrar esta hoja (${esc(h.tipo)})? No se puede deshacer.`, 'Borrar', () => { const vid = h.vehiculoId; db.hojas = db.hojas.filter(x => x.id !== h.id); guardar(); toast('Hoja borrada'); ir('#vehiculo-' + vid); }); } break;
    case 'resolver-hoja': { const h = hoja(el.dataset.id); if (!h) break;
        abrirModal('Marcar como resuelta', `<div class="campo"><label for="hr-txt">¿Cómo se resolvió? (opcional)</label><textarea id="hr-txt" rows="4" placeholder="Ej.: se cambió el buje, quedó sin ruido"></textarea></div>
          <div class="form-acc"><button class="btn" data-act="cerrar-modal">Cancelar</button><button class="btn pri" id="hr-ok">${ico('check')}Marcar resuelta</button></div>`);
        $('#hr-ok').onclick = () => { Object.assign(h, {estado:'Resuelta', resueltaFecha:new Date().toISOString(), resolucion:$('#hr-txt').value.trim()}); guardar(); cerrarModal(); render(); toast('Hoja resuelta','ok'); };
      } break;
    case 'reabrir-hoja': { const h = hoja(el.dataset.id); if (h){ Object.assign(h, {estado:'Abierta', resueltaFecha:'', resolucion:''}); guardar(); render(); toast('Hoja abierta de nuevo'); } } break;
    case 'ver-foto-hoja': { const h = hoja(window.__hojaActual); if (h) abrirModal('Foto', `<img class="modal-img" src="${h.fotos[+el.dataset.i]}" alt="Foto de la hoja">`); } break;
    case 'borrar-foto-hoja': { const h = hoja(window.__hojaActual); if (h) confirmar('Borrar foto', '¿Borrar esta foto de la hoja?', 'Borrar', () => { h.fotos.splice(+el.dataset.i,1); guardar(); render(); }); } break;
    case 'quitar-foto-hf': HF.fotos.splice(+el.dataset.i,1); pintarFotosHF(); break;
    case 'h-tab': H.tab = el.dataset.t; H.estado = ''; render(); break;
    case 'h-periodo': H.periodo = el.dataset.p; $$('[data-act=h-periodo]').forEach(b => { const on = b.dataset.p === H.periodo; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      $('#h-rango').hidden = H.periodo !== 'rango'; $('#hist-res').innerHTML = resultadosHistHTML(); { const n = filtrosActivos(); $('#h-n').textContent = n ? n + (n===1?' activo':' activos') : ''; } break;
    case 'h-limpiar': H = {...H_DEF, tab:H.tab}; render(); break;
    case 'h-copiar': copiarTSV(filasHistorial()); break;
    case 'h-imprimir': imprimirHistorial(); break;
    case 'msg': abrirMensaje({cid:el.dataset.cli, oid:el.dataset.ord || null, tipo:el.dataset.tipo}); break;
    case 'plantilla2-def': $('#cfg-pl2').value = PLANTILLA_DEMORA; break;
    case 'borrar-msg': { const m = db.mensajes.find(x => x.id === el.dataset.id);
        if (m) confirmar('Borrar mensaje guardado', `¿Borrar el botón «${esc(m.titulo)}»?`, 'Borrar', () => { db.mensajes = db.mensajes.filter(x => x.id !== m.id); guardar(); render(); toast('Mensaje borrado'); }); } break;
    case 'editar-msg': { const m = db.mensajes.find(x => x.id === el.dataset.id); if (!m) break;
        abrirModal('Editar mensaje guardado', `<form id="form-msg" novalidate>
          <div class="campo" id="em-c-tit"><label for="em-tit">Nombre del botón</label><input id="em-tit" maxlength="40" value="${esc(m.titulo)}"><span class="err-msg">Ponele un nombre.</span></div>
          <div class="campo" id="em-c-txt"><label for="em-txt">Texto</label><textarea id="em-txt" rows="8" style="min-height:180px">${esc(m.texto)}</textarea>
            <span class="ayuda">Podés usar: {cliente} {vehiculo} {patente} {trabajos} {total} {taller} {direccion} {horario} {email} {orden} {km}</span><span class="err-msg">Escribí el mensaje.</span></div>
          <div class="form-acc"><button type="button" class="btn" data-act="cerrar-modal">Cancelar</button><button class="btn pri" type="submit">Guardar</button></div></form>`);
        $('#form-msg').onsubmit = (ev) => { ev.preventDefault();
          const t = $('#em-tit').value.trim(), x = $('#em-txt').value.trim();
          $('#em-c-tit').classList.toggle('err', !t); $('#em-c-txt').classList.toggle('err', !x); if (!t || !x) return;
          Object.assign(m, {titulo:t, texto:x}); guardar(); cerrarModal(); render(); toast('Mensaje actualizado','ok'); };
      } break;
    case 'plantilla-def': $('#cfg-pl').value = PLANTILLA_DEFECTO; $('#cfg-pl').dispatchEvent(new Event('input')); break;
    case 'exportar': exportarCSV(); break;
    case 'copiar-excel': {
      const filas = [['Orden','Fecha ingreso','Estado','Patente','Vehículo','Cliente','WhatsApp','Km','Trabajos','Total','Fecha entrega']];
      db.ordenes.slice().sort((a,b)=>a.numero-b.numero).forEach(o => { const v = vehiculo(o.vehiculoId), c = cliente(v?.clienteId);
        filas.push([nroOrden(o.numero), fecha(o.fechaIngreso), o.estado, v?.patente||'', nombreVeh(v), c?.nombre||'', c?.telefono||'', o.km||'', o.tareas.map(t=>t.texto).join(' | '), o.total||0, o.fechaEntrega?fecha(o.fechaEntrega):'']); });
      const tsv = filas.map(f => f.map(x => String(x).replace(/[\t\n]/g,' ')).join('\t')).join('\n');
      if (!navigator.clipboard) { toast('No se pudo copiar en este navegador','error'); break; }
      navigator.clipboard.writeText(tsv).then(() => toast('Copiado: pegalo en una planilla de Excel','ok'), () => toast('No se pudo copiar en este navegador','error'));
    } break;
    case 'reset': confirmar('Restablecer datos de ejemplo', 'Se borra todo lo que cargaste y vuelven los datos de muestra. ¿Seguro?', 'Restablecer', () => { db = datosEjemplo(); guardar(); filtroEstado='activos'; busqTaller=busqVeh=busqCli=''; H = {...H_DEF}; ir('#taller'); render(); toast('Datos de ejemplo restablecidos','ok'); }); break;
    case 'salir': abrirSesion(false); $('#root').innerHTML=''; render(); break;
  }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset?.act === 'subir-foto' && el.files?.length){
    const o = orden(window.__ordenActual); if (!o) return;
    const nuevas = await leerFotos(el.files); o.fotos.push(...nuevas);
    if (guardar()) { render(); toast(nuevas.length === 1 ? 'Foto agregada' : nuevas.length + ' fotos agregadas','ok'); } else { o.fotos.splice(-nuevas.length); }
  }
  if (el.dataset?.act === 'subir-foto-hoja' && el.files?.length){
    const h = hoja(window.__hojaActual); if (!h) return;
    const nuevas = await leerFotos(el.files); h.fotos = h.fotos || []; h.fotos.push(...nuevas);
    if (guardar()) { render(); toast(nuevas.length === 1 ? 'Foto agregada' : nuevas.length + ' fotos agregadas','ok'); } else { h.fotos.splice(-nuevas.length); }
  }
  if (el.dataset?.act === 'foto-hf' && el.files?.length){
    HF.fotos.push(...await leerFotos(el.files)); pintarFotosHF();
  }
  if (el.dataset?.act === 'foto-form' && el.files?.length){
    F.fotos.push(...await leerFotos(el.files)); pintarFotosForm();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#modal-root').innerHTML) cerrarModal(); });
window.addEventListener('hashchange', () => { cerrarModal(); render(); });

/* ---------- Arranque ---------- */
cargar();
render();
</script>
</body>
</html>
